[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-software-assistant"
version = "0.3.0"
description = "A local, auditable multi-agent software engineering MVD"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.125.0",
  "uvicorn==0.38.0",
  "pydantic==2.11.7",
  "openai==2.18.0",
  "python-dotenv==1.1.1",
  "langgraph==1.0.5",
  "langgraph-checkpoint-sqlite==3.0.3",
  "aiosqlite==0.22.1",
  "PyYAML==6.0.1",
]

[project.optional-dependencies]
dev = [
  "coverage==7.15.4",
  "pytest==7.4.4",
  "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
